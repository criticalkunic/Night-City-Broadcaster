<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night City Broadcaster</title><link rel="stylesheet" href="/static/shared/card-effects.css"><link rel="stylesheet" href="/static/shared/ambient.css"><link rel="stylesheet" href="/static/shared/overlay-theme.css"><link rel="stylesheet" href="/static/shared/broadcast-chrome.css"><link rel="stylesheet" href="/static/board/board.css"></head>
<body><main id="stage">
<header><div class="brand"><strong class="broadcast-wordmark">NIGHT CITY <em>BROADCASTER</em></strong><span>BROADCAST / <b id="player-name">SOLO</b></span></div><div class="match-status" id="match-status">STANDBY</div><div id="cred" class="cred">STREET CRED <strong id="cred-value">0</strong></div></header>
<div class="arena"><section class="panel play"><div class="panel-head"><h1>PLAY AREA</h1><span class="signal">● LIVE</span></div><div class="camera"><img data-feed="play" alt="Live play area"></div><div class="corner a"></div><div class="corner b"></div></section>
<aside id="side"><section id="latest" hidden><img id="latest-art" alt="Latest card artwork"></section><section id="eddies" class="panel"><div class="panel-head"><h2>EDDIES</h2><span>€$</span></div><div class="camera"><img data-feed="eddies" alt="Live Eddie area"></div></section></aside></div>
<footer><section class="panel legends"><div class="panel-head"><h2>LEGENDS</h2><span id="flips">0 / 3 FLIPPED</span></div><div id="legends"></div></section>
<section class="panel economy"><div class="panel-head"><h2>GIGS</h2><span id="gig-caption">CONTROLLED</span></div><div id="gigs"></div><div id="stolen-row" hidden><div id="stolen"></div><span class="stolen-label">CAPTURED GIGS</span></div><div class="camera economy-camera" id="gig-camera" hidden><img data-feed="gigs" alt="Live gig area"></div></section>
<section class="panel reserve"><div class="panel-head"><h2>FIXER</h2><span id="reserve-count"></span></div><div id="fixer"></div><div class="camera economy-camera" id="fixer-camera" hidden><img data-feed="fixer" alt="Live fixer area"></div></section></footer>
</main><script src="/static/shared/card-effects.js"></script><script src="/static/board/dice.js"></script><script src="/static/board/camera-feed.js"></script><script src="/static/board/board.js"></script></body></html>
