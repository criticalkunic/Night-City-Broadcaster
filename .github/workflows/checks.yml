name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: First-launch and download tests
        run: >-
          python -m pytest -q
          tests/test_first_run.py tests/test_card_back.py
          tests/test_import_cards.py tests/test_art_download.py tests/test_broadcast_url.py
      - name: Browser and desktop tests
        run: for test in tests/*.cjs; do node "$test" || exit 1; done
      - name: Check launcher syntax
        run: bash -n start.sh
